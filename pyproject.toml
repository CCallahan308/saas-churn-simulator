# Tooling configuration for the SaaS Churn Simulator.
#
# Scoped intentionally to tool config (pytest + ruff). The project imports its
# package as ``src`` (e.g. ``from src.models import RetentionModel``); adding a
# build-system/[project] table would require renaming that layout, so it is
# left out to preserve the existing import convention.

[tool.pytest.ini_options]
# Make ``from src.X import ...`` resolve when running ``pytest`` from the repo
# root, replacing the previous per-file ``sys.path.insert(0, "..")`` hack.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
# Lint rule selection is left at ruff's defaults. ruff 0.16 widened the default
# set; the new purely-mechanical rules were fixed in code, and these are
# deliberately deferred (each needs site-by-site judgment, not a blind rewrite):
# - BLE001/S110: dashboard fallbacks intentionally degrade silently
# - DTZ001 (tests): fixtures build naive datetimes to match the naive source data
[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]
