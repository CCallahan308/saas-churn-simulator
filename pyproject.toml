# Tooling configuration for the SaaS Churn Simulator.
#
# Scoped intentionally to tool config (pytest + ruff). The project imports its
# package as ``src`` (e.g. ``from src.models import RetentionModel``); adding a
# build-system/[project] table would require renaming that layout, so it is
# left out to preserve the existing import convention.

[tool.pytest.ini_options]
# Make ``from src.X import ...`` resolve when running ``pytest`` from the repo
# root, replacing the previous per-file ``sys.path.insert(0, "..")`` hack.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
# Lint rule selection is left at ruff's defaults (E4/E7/E9/F) - the same set CI
# has been enforcing - so this config centralizes settings without introducing
# new violations.
